name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Download commentary.db
        run: |
          mkdir -p app/src/main/assets/databases
          echo "Downloading DB..."
          curl -L --fail -o app/src/main/assets/databases/commentary.db https://archive.org/download/commentary_202610/commentary.db
          ls -lh app/src/main/assets/databases/commentary.db
          echo "DB size:"
          du -h app/src/main/assets/databases/commentary.db

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bible-Commentary-APK
          path: app/build/outputs/apk/debug/app-debug.apk