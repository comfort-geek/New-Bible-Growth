name: Build APK FINAL JAVA17 FIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17 - REQUIRED FOR SDKMANAGER
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps + aidl
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip git wget aidl ant
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
          java -version
          echo $JAVA_HOME

      - name: Download DB 73MB
        run: |
          wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Clean EVERYTHING - No old sdkmanager
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -f settings.gradle

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-arm7a-JAVA17
          path: bin/*.apk