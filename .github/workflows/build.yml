name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DB from Archive
        run: |
          apt-get update -y
          apt-get install -y wget curl
          curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Patch Buildozer root check
        run: |
          # Find and disable check_root
          FILE=$(find /home/user/.venv -name __init__.py | grep buildozer | head -1)
          echo "Patching $FILE"
          sed -i 's/def check_root/def check_root_old/' $FILE
          echo -e "    def check_root(self):\n        print('Root check bypassed')\n        return True" >> $FILE
          # Also try direct replacement
          sed -i 's/self.check_root()/print("Root check skipped")/' $FILE || true
          grep -n "check_root" $FILE | head

      - name: Build APK
        run: |
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk