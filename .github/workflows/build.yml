name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean old build
        run: rm -rf .buildozer bin

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip wget curl autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev libltdl-dev cmake
          pip install buildozer cython==0.29.33

      - name: FORCE SPEC
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Enduring Word
          package.name = enduringword
          package.domain = org.enduring.word
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,db
          source.include_patterns = enduring_word_full.db
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license_agreements = True
          android.permissions = INTERNET
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          cat buildozer.spec

      - name: Download DB
        run: |
          curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: PRE-INSTALL SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mkdir -p $SDK/cmdline-tools/latest
          mv cmdline-tools/* $SDK/cmdline-tools/latest/ 2>/dev/null || true
          mkdir -p $SDK/tools/bin
          printf '#!/bin/bash\nexport JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64\nexec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"\n' > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          mkdir -p $SDK/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b3" > $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;25.1.8937393"

      - name: Build APK
        run: |
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_LATEST_HOME
          unset ANDROID_HOME
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          buildozer android debug

      - name: Find APKs
        if: always()
        run: find . -name "*.apk" -type f || echo "No APK found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: |
            bin/
            **/*.apk
          if-no-files-found: warn

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .buildozer/logs/