name: Build APK 
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Java 17
        run: |
          echo $JAVA_HOME
          java -version
          javac -version

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install https://github.com/kivy/buildozer/archive/master.zip https://github.com/kivy/python-for-android/archive/master.zip cython

      - name: FORCE SPEC
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Enduring Word
          package.name = enduringword
          package.domain = org.enduring.word
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,db
          source.include_patterns = enduring_word_full.db
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.accept_sdk_license_agreements = True
          [buildozer]
          log_level = 2
          EOF

      - name: Download DB
        run: curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: PRE-INSTALL SDK + FIX sdkmanager path + Java 17 licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/cmdline-tools
          # Download cmdline-tools
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
            unzip -q cmd.zip
            mkdir -p $SDK/cmdline-tools/latest
            mv cmdline-tools/* $SDK/cmdline-tools/latest/ || true
            mv cmdline-tools-*/latest/* $SDK/cmdline-tools/latest/ 2>/dev/null || true
          fi
          # FIX LINE 56: Create old path Buildozer looks for
          mkdir -p $SDK/tools/bin
          echo '#!/bin/bash
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          ' > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          
          # Accept licenses + install both build-tools
          mkdir -p $SDK/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b3" > $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          ls $SDK/build-tools/
          cat $SDK/tools/bin/sdkmanager
          $SDK/tools/bin/sdkmanager --version

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          buildozer android debug --verbose
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk
          if-no-files-found: error