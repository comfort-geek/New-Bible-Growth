name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 70MB DB from Internet Archive
        run: |
          apt-get update -y
          apt-get install -y wget curl
          curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db
          test $(stat -c%s enduring_word_full.db) -gt 10000000

      - name: Build APK
        run: |
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk