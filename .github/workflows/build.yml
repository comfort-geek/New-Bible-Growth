name: Build Enduring Word APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix missing Android files
        run: |
          mkdir -p app/src/main/java/com/enduringword/app
          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
           namespace 'com.enduringword.app'
           compileSdk 34
           defaultConfig {
            applicationId "com.enduringword.app"
            minSdk 21
            targetSdk 34
            versionCode 76
            versionName "1.0"
           }
          }
          dependencies {
           implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat app/build.gradle
          ls -R

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK
          path: app/build/outputs/apk/debug/*.apk