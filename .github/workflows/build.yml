name: Build APK 50MB FINAL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 + Python 3.10
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install buildozer + aidl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl ant
          pip install buildozer==1.5.0 cython==0.29.33

      - name: FIX SDK + NDK + sdkmanager path
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c
          ln -s /usr/local/lib/android/sdk/ndk/30.0.16248370 ~/.buildozer/android/platform/android-ndk-r28c
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager || true
          
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          ls -l ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ls ~/.buildozer/android/platform/android-sdk/build-tools/ | head -10

      - name: Download DB
        run: wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-FIXED
          path: bin/*.apk