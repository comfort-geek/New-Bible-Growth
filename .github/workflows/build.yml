name: Build Enduring Word APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/enduringword/app
          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.enduringword.app'; compileSdk 34; defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 34; versionCode 82; versionName '1.0' } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > app/build.gradle
      - name: Add AndroidManifest
        run: |
          mkdir -p app/src/main
          printf '<?xml version="1.0"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Enduring Word"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
      - name: Add MainActivity
        run: |
          printf 'package com.enduringword.app;import android.os.Bundle;import android.widget.TextView;import androidx.appcompat.app.AppCompatActivity;public class MainActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);TextView tv=new TextView(this);tv.setText("Enduring Word - 13 Features Ready - James 2");tv.setTextSize(20);setContentView(tv);}}' > app/src/main/java/com/enduringword/app/MainActivity.java
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK-82-FIXED
          path: app/build/outputs/apk/debug/*.apk