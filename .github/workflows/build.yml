name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4
      
      - name: Download DB
        run: |
          wget -O enduring_word_full.db "https://github.com/comfort-geek/New-Bible-Growth/releases/download/V1.2/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake libtinfo6
      - name: Patch Buildozer for new SDK
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          # Find and patch the sdkmanager path bug - CORRECT PATH
          BUILDOZER_DIR=$(python -c "import buildozer.targets.android, os; print(os.path.dirname(buildozer.targets.android.__file__))")
          BUILDOZER_FILE="$BUILDOZER_DIR/android.py"
          echo "Patching $BUILDOZER_FILE"
          sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' "$BUILDOZER_FILE"
          sed -i 's|tools/bin/avdmanager|cmdline-tools/latest/bin/avdmanager|g' "$BUILDOZER_FILE"
          echo "Patched OK" https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          # Find and patch the sdkmanager path bug
          BUILDOZER_FILE=$(python -c "import buildozer.targets.android; import os; print(os.path.dirname(buildozer.targets.android.__file__))")/targets/android.py
          echo "Patching $BUILDOZER_FILE"
          sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' $BUILDOZER_FILE
          sed -i 's|tools/bin/avdmanager|cmdline-tools/latest/bin/avdmanager|g' $BUILDOZER_FILE
          # Also create old path symlink as backup
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          grep -n "sdkmanager" $BUILDOZER_FILE | head

      - name: Build APK
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk