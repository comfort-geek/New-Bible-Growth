name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install https://github.com/kivy/buildozer/archive/master.zip https://github.com/kivy/python-for-android/archive/master.zip cython

      - name: FORCE CORRECT buildozer.spec - THIS FIXES build-tools 37 ERROR
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Enduring Word
          package.name = enduringword
          package.domain = org.enduring.word
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,db
          source.include_patterns = enduring_word_full.db
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.accept_sdk_license_agreements = True
          android.permissions = INTERNET
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          cat buildozer.spec

      - name: Download DB
        run: curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: Fix sdkmanager + Accept Licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/tools/bin $SDK/licenses $SDK/cmdline-tools
          echo '#!/bin/bash
          REAL="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$REAL" ] && exec "$REAL" "$@"
          exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@" 2>/dev/null || exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"
          ' > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b3" > $SDK/licenses/android-sdk-license
          mkdir -p $SDK/licenses
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          ls $SDK/build-tools/ || echo "build-tools not yet"

      - name: Build APK
        run: |
          set -e
          buildozer android debug --verbose
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk
          if-no-files-found: error