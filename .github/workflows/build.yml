name: Build Enduring Word APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create full minimal Android project
        run: |
          mkdir -p app/src/main/java/com/enduringword/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
           namespace 'com.enduringword.app'
           compileSdk 34
           defaultConfig {
            applicationId "com.enduringword.app"
            minSdk 21
            targetSdk 34
            versionCode 78
            versionName "1.0"
           }
          }
          dependencies {
           implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Enduring Word">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
           </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Enduring Word</string></resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center"><TextView android:text="Enduring Word - 13 Features - James 2 Ready" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>
          EOF

          cat > app/src/main/java/com/enduringword/app/MainActivity.java << 'EOF'
          package com.enduringword.app;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
           protected void onCreate(Bundle b){ super.onCreate(b); setContentView(com.enduringword.app.R.layout.activity_main); }
          }
          EOF

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK-FINAL-13FEATURES
          path: app/build/outputs/apk/debug/app-debug.apk