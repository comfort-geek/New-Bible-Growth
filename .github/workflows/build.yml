name: Build APK Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Gradle
        run: rm -f settings.gradle build.gradle && python3 -c "open('settings.gradle','w').write('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\ninclude \":app\"\n')" && python3 -c "open('build.gradle','w').write('// empty\n')" && python3 -c "open('gradle.properties','w').write('org.gradle.jvmargs=-Xmx2g\n')" && python3 -c "open('local.properties','w').write('sdk.dir=/usr/local/lib/android/sdk\n')" && python3 -c "open('app/build.gradle','w').write('plugins { id \"com.android.application\" version \"8.1.4\" }\nandroid {\n namespace \"com.enduringword.app\"\n compileSdk 33\n defaultConfig {\n applicationId \"com.enduringword.app\"\n minSdk 21\n targetSdk 33\n versionCode 316\n versionName \"Minimal\"\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n}\n')" && mkdir -p gradle/wrapper && python3 -c "open('gradle/wrapper/gradle-wrapper.properties','w').write('distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n')" && curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar && curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew && chmod +x gradlew
      - name: Build APK
        run: chmod +x gradlew &&./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK
          path: app/build/outputs/apk/debug/app-debug.apk
