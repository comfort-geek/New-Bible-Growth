name: Build APK 50MB AUTO-DETECT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 + Python 3.10
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install buildozer + aidl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl ant
          pip install buildozer==1.5.0 cython==0.29.33

      - name: AUTO-FIX BUILD-TOOLS + LICENSE - WORKS ON NEW IMAGE
        run: |
          echo "=== What build-tools does this runner have? ==="
          ls /usr/local/lib/android/sdk/build-tools/
          
          echo "=== What NDK does this runner have? ==="
          ls /usr/local/lib/android/sdk/ndk/
          
          # Pick the newest build-tools automatically
          LATEST_BT=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n1)
          LATEST_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n1)
          echo "LATEST_BT=$LATEST_BT" >> $GITHUB_ENV
          echo "LATEST_NDK=$LATEST_NDK" >> $GITHUB_ENV
          echo "Found Build-Tools: $LATEST_BT"
          echo "Found NDK: $LATEST_NDK"
          
          # Copy ALL build-tools to Buildozer folder
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r /usr/local/lib/android/sdk/build-tools/* ~/.buildozer/android/platform/android-sdk/build-tools/
          
          # Copy licenses
          cp -r /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c4501b4f66a136d" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Also copy platforms
          mkdir -p ~/.buildozer/android/platform/android-sdk/platforms
          cp -r /usr/local/lib/android/sdk/platforms/android-33 ~/.buildozer/android/platform/android-sdk/platforms/ 2>/dev/null || cp -r /usr/local/lib/android/sdk/platforms/android-34 ~/.buildozer/android/platform/android-sdk/platforms/ || true
          
          ls ~/.buildozer/android/platform/android-sdk/build-tools/

      - name: Download DB
        run: wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: Build APK - Uses auto-detected SDK
        run: |
          echo "Using Build-Tools $LATEST_BT and NDK $LATEST_NDK"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-AUTO-FIXED
          path: bin/*.apk