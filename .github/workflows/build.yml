name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip git wget
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Download DB - 73.45 MB
        run: |
          wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Build APK - CLEAN for arm7a
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -f settings.gradle
          rm -rf bin
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-arm7a-73MB
          path: bin/*.apk
          retention-days: 7