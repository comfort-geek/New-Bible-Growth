name: Build Enduring Word - Genesis to Revelation
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Genesis to Revelation Reader
        run: |
          mkdir -p /tmp/save
          if [ -f app/src/main/assets/bible.db ]; then cp app/src/main/assets/bible.db /tmp/save/bible.db; fi
          if [ -f app/src/main/assets/bible.sqlite ]; then cp app/src/main/assets/bible.sqlite /tmp/save/bible.db; fi
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradle gradle-wrapper.*.gradle
          python3 << 'PY'
          import pathlib, shutil
          pathlib.Path("app/src/main/java/com/enduringword/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          if pathlib.Path("/tmp/save/bible.db").exists():
              shutil.copy("/tmp/save/bible.db", "app/src/main/assets/bible.db")
          import os
          sdk = os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          open("build.gradle","w").write("// fixed\n")
          open("settings.gradle","w").write("""
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins { id 'com.android.application' version '8.1.4' }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          """)
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enduringword.app'
              compileSdk 33
              defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 102; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Enduring Word" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write('package com.enduringword.app;import android.app.Activity;import android.database.Cursor;import android.database.sqlite.SQLiteDatabase;import android.os.Bundle;import android.text.Editable;import android.text.TextWatcher;import android.view.ViewGroup;import android.widget.Button;import android.widget.EditText;import android.widget.LinearLayout;import android.widget.ScrollView;import android.widget.TextView;import java.io.File;import java.io.FileOutputStream;import java.io.InputStream;public class MainActivity extends Activity{String fullText="";TextView contentView;ScrollView scroll;protected void onCreate(Bundle b){super.onCreate(b);LinearLayout main=new LinearLayout(this);main.setOrientation(LinearLayout.VERTICAL);main.setPadding(15,15,15,15);TextView title=new TextView(this);title.setText("Enduring Word - Genesis to Revelation");title.setTextSize(18);title.setPadding(0,0,0,10);main.addView(title);EditText search=new EditText(this);search.setHint("Search Genesis, Exodus, Matthew...");main.addView(search);LinearLayout books=new LinearLayout(this);books.setOrientation(LinearLayout.HORIZONTAL);String[] bookList={"Genesis","Exodus","Psalm","Matthew","John","Revelation"};for(String bk:bookList){Button btn=new Button(this);btn.setText(bk);btn.setOnClickListener(v->{int idx=fullText.toLowerCase().indexOf(bk.toLowerCase());if(idx>=0){contentView.setText(fullText.substring(idx, Math.min(fullText.length(), idx+20000)));scroll.scrollTo(0,0);}});books.addView(btn);}HorizontalScrollViewWrap: {android.widget.HorizontalScrollView hsv=new android.widget.HorizontalScrollView(this);hsv.addView(books);main.addView(hsv);}scroll=new ScrollView(this);contentView=new TextView(this);contentView.setTextSize(16);contentView.setLineSpacing(4,1.3f);contentView.setPadding(10,20,10,20);scroll.addView(contentView);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f);main.addView(scroll,lp);setContentView(main);try{File outFile=new File(getFilesDir(),"bible.db");if(!outFile.exists()){InputStream is=getAssets().open("bible.db");FileOutputStream fos=new FileOutputStream(outFile);byte[] buf=new byte[8192];int len;while((len=is.read(buf))>0)fos.write(buf,0,len);fos.close();is.close();}SQLiteDatabase db=SQLiteDatabase.openDatabase(outFile.getPath(),null,SQLiteDatabase.OPEN_READONLY);Cursor v=db.rawQuery("SELECT * FROM commentaries LIMIT 1",null);if(v.moveToFirst()){StringBuilder sb=new StringBuilder();for(int i=0;i<v.getColumnCount();i++){String val=v.getString(i);if(val!=null && val.length()>100) sb.append(val).append("\\n\\n");}fullText=sb.toString();if(fullText.length()==0) fullText=v.getString(0);contentView.setText(fullText.substring(0, Math.min(fullText.length(), 30000))+"\\n\\n[Full commentary loaded: "+fullText.length()+" chars. Use search to navigate]");}v.close();db.close();}catch(Exception e){contentView.setText("Error: "+e.toString());}search.addTextChangedListener(new TextWatcher(){public void beforeTextChanged(CharSequence s,int a,int b,int c){}public void onTextChanged(CharSequence s,int a,int b,int c){}public void afterTextChanged(Editable s){String q=s.toString();if(q.length()<2) return;int idx=fullText.toLowerCase().indexOf(q.toLowerCase());if(idx>=0){int start=Math.max(0, idx-200);int end=Math.min(fullText.length(), idx+5000);contentView.setText("..."+fullText.substring(start,end)+"...");scroll.scrollTo(0,0);}}});}}')
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-Genesis-Revelation
          path: app/build/outputs/apk/debug/*.apk