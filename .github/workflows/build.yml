name: Build APK CIRCLE FIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix sdkmanager circle error
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip git wget aidl ant
          
          # 1. CREATE BUILDOZER SDK STRUCTURE BEFORE BUILDOZER STARTS
          mkdir -p ~/.buildozer/android/platform/android-sdk
          
          # 2. COPY ENTIRE cmdline-tools FROM SYSTEM TO BUILDOZER SDK (not just binary)
          cp -r $ANDROID_HOME/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools || true
          ls ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/
          
          # 3. CREATE OLD PATH THAT YOUR SCREENSHOT ASKS FOR (tools/bin/sdkmanager)
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          
          # 4. ACCEPT ALL LICENSES IN BUILDOZER SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c4501b4f66a136d" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          cp ~/.buildozer/android/platform/android-sdk/licenses/* ~/.android/licenses/ || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 5. PRE-INSTALL build-tools TO KILL AIDL ERROR NEXT
          ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" "platforms;android-33" || true
          
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Download DB 73MB
        run: |
          wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Clean
        run: |
          rm -rf bin
          rm -f settings.gradle

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-arm7a-CIRCLE-FIXED
          path: bin/*.apk