name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install https://github.com/kivy/buildozer/archive/master.zip https://github.com/kivy/python-for-android/archive/master.zip cython

      - name: Download DB
        run: curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: Fix sdkmanager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/tools/bin
          echo '#!/bin/bash
          REAL="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$REAL" ] && exec "$REAL" "$@"
          exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@" 2>/dev/null || exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"
          ' > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          mkdir -p $SDK/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b3" > $SDK/licenses/android-sdk-license

      - name: Build APK
        run: |
          set -e
          buildozer android debug --verbose
          echo "=== BIN FOLDER ==="
          ls -lhR bin || echo "NO BIN FOLDER"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk
          if-no-files-found: error