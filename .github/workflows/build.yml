name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DB from Archive
        run: |
          apt-get update -y
          apt-get install -y wget curl
          curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: NUCLEAR Patch - Kill root check
        run: |
          FILE="/home/user/.venv/lib/python3.14/site-packages/buildozer/__init__.py"
          sed -i "s/cont = input/# cont = input/" "$FILE"
          sed -i "s/self.check_root()/pass # self.check_root()/" "$FILE"
          python3 << 'PY'
          import pathlib
          f = pathlib.Path("/home/user/.venv/lib/python3.14/site-packages/buildozer/__init__.py")
          text = f.read_text()
          text = text.replace("def check_root(self):", "def check_root_DISABLED(self):")
          text += "\n\ndef check_root(self):\n    print('ROOT CHECK BYPASSED')\n    return True\n"
          f.write_text(text)
          PY

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk