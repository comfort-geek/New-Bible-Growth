name: Build Enduring Word - BEAUTIFUL HTML RENDER
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Beautiful HTML Reader
        run: |
          mkdir -p /tmp/save
          if [ -f app/src/main/assets/bible.db ]; then cp app/src/main/assets/bible.db /tmp/save/bible.db; fi
          if [ -f app/src/main/assets/bible.sqlite ]; then cp app/src/main/assets/bible.sqlite /tmp/save/bible.db; fi
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradle gradle-wrapper.*.gradle
          python3 << 'PY'
          import pathlib, shutil
          pathlib.Path("app/src/main/java/com/enduringword/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          if pathlib.Path("/tmp/save/bible.db").exists():
              shutil.copy("/tmp/save/bible.db", "app/src/main/assets/bible.db")
              print("Restored DB")
          import os
          sdk = os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          open("build.gradle","w").write("// fixed\n")
          open("settings.gradle","w").write("""
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins { id 'com.android.application' version '8.1.4' }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          """)
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enduringword.app'
              compileSdk 33
              defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 103; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Enduring Word" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write('package com.enduringword.app;import android.app.Activity;import android.database.Cursor;import android.database.sqlite.SQLiteDatabase;import android.os.Bundle;import android.text.Editable;import android.text.TextWatcher;import android.view.ViewGroup;import android.webkit.WebView;import android.widget.Button;import android.widget.EditText;import android.widget.HorizontalScrollView;import android.widget.LinearLayout;import java.io.File;import java.io.FileOutputStream;import java.io.InputStream;public class MainActivity extends Activity{String fullText="";WebView webView;protected void onCreate(Bundle b){super.onCreate(b);LinearLayout main=new LinearLayout(this);main.setOrientation(LinearLayout.VERTICAL);main.setPadding(10,10,10,10);EditText search=new EditText(this);search.setHint("Search Genesis, Exodus, Matthew, Revelation...");main.addView(search);LinearLayout books=new LinearLayout(this);books.setOrientation(LinearLayout.HORIZONTAL);String[] bookList={"Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Psalms","Proverbs","Isaiah","Matthew","Mark","Luke","John","Acts","Romans","Revelation"};for(String bk:bookList){Button btn=new Button(this);btn.setText(bk);btn.setTextSize(11);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);lp.setMargins(5,5,5,5);btn.setLayoutParams(lp);btn.setOnClickListener(v->{showBook(bk);});books.addView(btn);}HorizontalScrollView hsv=new HorizontalScrollView(this);hsv.addView(books);main.addView(hsv);webView=new WebView(this);webView.getSettings().setJavaScriptEnabled(false);LinearLayout.LayoutParams wlp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f);main.addView(webView,wlp);setContentView(main);try{File outFile=new File(getFilesDir(),"bible.db");if(!outFile.exists()){InputStream is=getAssets().open("bible.db");FileOutputStream fos=new FileOutputStream(outFile);byte[] buf=new byte[8192];int len;while((len=is.read(buf))>0)fos.write(buf,0,len);fos.close();is.close();}SQLiteDatabase db=SQLiteDatabase.openDatabase(outFile.getPath(),null,SQLiteDatabase.OPEN_READONLY);Cursor v=db.rawQuery("SELECT * FROM commentaries LIMIT 1",null);if(v.moveToFirst()){StringBuilder sb=new StringBuilder();for(int i=0;i<v.getColumnCount();i++){String val=v.getString(i);if(val!=null && val.length()>100) sb.append(val).append("\\n");}fullText=sb.toString();if(fullText.length()<100) fullText=v.getString(0);showHtml(fullText.substring(0, Math.min(fullText.length(), 40000)));}v.close();db.close();}catch(Exception e){showHtml("<h3>Error: "+e.toString()+"</h3>");}search.addTextChangedListener(new TextWatcher(){public void beforeTextChanged(CharSequence s,int a,int b,int c){}public void onTextChanged(CharSequence s,int a,int b,int c){}public void afterTextChanged(Editable s){String q=s.toString();if(q.length()<2) return;int idx=fullText.toLowerCase().indexOf(q.toLowerCase());if(idx>=0){int start=Math.max(0, idx-500);int end=Math.min(fullText.length(), idx+15000);showHtml(fullText.substring(start,end));}}});}void showBook(String book){int idx=fullText.toLowerCase().indexOf(book.toLowerCase());if(idx>=0){int end=Math.min(fullText.length(), idx+25000);showHtml(fullText.substring(idx,end));}}void showHtml(String htmlContent){String html="<!DOCTYPE html><html><head><meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1\\"><style>body{font-family: sans-serif; font-size:16px; line-height:1.6; padding:15px; color:#222;} h1,h2,h3,h4{color:#1a5276; margin-top:20px;} p{margin:10px 0;} </style></head><body>"+htmlContent+"<br><br><hr><p><i>Enduring Word Commentary - Genesis to Revelation</i></p></body></html>";webView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);}}')
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-Beautiful-HTML
          path: app/build/outputs/apk/debug/*.apk