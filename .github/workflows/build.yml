name: Build Enduring Word NO HEADER CLEAN
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build No Header
        run: |
          mkdir -p /tmp/save
          if [ -f app/src/main/assets/enduring_word_structured.sqlite3 ]; then cp app/src/main/assets/enduring_word_structured.sqlite3 /tmp/save/db.db; fi
          if [ -f app/src/main/assets/bible.db ]; then cp app/src/main/assets/bible.db /tmp/save/db.db; fi
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradle gradle-wrapper.*.gradle
          python3 << 'PY'
          import pathlib, shutil
          pathlib.Path("app/src/main/java/com/enduringword/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          if pathlib.Path("/tmp/save/db.db").exists():
              shutil.copy("/tmp/save/db.db", "app/src/main/assets/enduring_word_structured.sqlite3")
          import os
          sdk = os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          open("build.gradle","w").write("// fixed\n")
          open("settings.gradle","w").write("""
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } plugins { id 'com.android.application' version '8.1.4' } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) repositories { google(); mavenCentral() } }
          include ':app'
          """)
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enduringword.app'
              compileSdk 33
              defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 302; versionName 'NoHeader' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write("""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <application android:label="Enduring Word" android:theme="@android:style/Theme.Material.Light">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          </application>
          </manifest>
          """)
          code = '''
          package com.enduringword.app;
          import android.app.Activity; import android.content.SharedPreferences; import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase; import android.graphics.Color; import android.os.Bundle;
          import android.speech.tts.TextToSpeech; import android.view.ViewGroup; import android.webkit.WebView; import android.widget.*;
          import java.io.File; import java.io.FileOutputStream; import java.io.InputStream; import java.util.*;
          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              SQLiteDatabase db; WebView webView; SharedPreferences prefs; TextToSpeech tts; boolean ttsReady=false;
              Spinner bookSpin, scopeSpin; LinearLayout chapterBox, verseBox; EditText searchBox; TextView smallStatus;
              List<String> allBooks = Arrays.asList("Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalm","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation");
              String currentBook="Genesis"; int currentChapter=1; int currentVerse=1; String currentPlain="";
              protected void onCreate(Bundle b){
                  super.onCreate(b); prefs=getSharedPreferences("ew_noheader",0); tts=new TextToSpeech(this,this);
                  LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(0xFFFFFFFF);

                  // NO HEADER - just clean search + scope row
                  LinearLayout topRow=new LinearLayout(this); topRow.setOrientation(LinearLayout.HORIZONTAL); topRow.setPadding(10,15,10,8);
                  searchBox=new EditText(this); searchBox.setHint("Search verse or word..."); searchBox.setTextSize(12); searchBox.setBackgroundColor(0xFFF1F5F9); searchBox.setPadding(12,8,12,8);
                  LinearLayout.LayoutParams searchLp=new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT,1f); topRow.addView(searchBox,searchLp);
                  scopeSpin=new Spinner(this); ArrayAdapter<String> scopeAd=new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, new String[]{"All","OT","NT","Book"}); scopeSpin.setAdapter(scopeAd); topRow.addView(scopeSpin);
                  root.addView(topRow);

                  smallStatus=new TextView(this); smallStatus.setPadding(12,2,12,4); smallStatus.setTextSize(10); smallStatus.setTextColor(0xFF94A3B8); root.addView(smallStatus);

                  // Book selector clean
                  bookSpin=new Spinner(this); ArrayAdapter<String> bookAd=new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, allBooks); bookSpin.setAdapter(bookAd); root.addView(bookSpin);

                  TextView chLabel=new TextView(this); chLabel.setText("Chapter"); chLabel.setPadding(12,6,12,2); chLabel.setTextSize(10); chLabel.setTextColor(0xFF94A3B8); root.addView(chLabel);
                  HorizontalScrollView chScroll=new HorizontalScrollView(this); chapterBox=new LinearLayout(this); chapterBox.setOrientation(LinearLayout.HORIZONTAL); chapterBox.setPadding(8,0,8,6); chScroll.addView(chapterBox); root.addView(chScroll);

                  TextView vLabel=new TextView(this); vLabel.setText("Verse"); vLabel.setPadding(12,4,12,2); vLabel.setTextSize(10); vLabel.setTextColor(0xFF94A3B8); root.addView(vLabel);
                  HorizontalScrollView vScroll=new HorizontalScrollView(this); verseBox=new LinearLayout(this); verseBox.setOrientation(LinearLayout.HORIZONTAL); verseBox.setPadding(8,0,8,8); vScroll.addView(verseBox); root.addView(vScroll);

                  webView=new WebView(this); webView.getSettings().setJavaScriptEnabled(true); webView.getSettings().setBuiltInZoomControls(true); webView.getSettings().setDisplayZoomControls(false);
                  LinearLayout.LayoutParams wlp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f); root.addView(webView,wlp);

                  // Clean bottom bar
                  LinearLayout bottom=new LinearLayout(this); bottom.setOrientation(LinearLayout.HORIZONTAL); bottom.setPadding(5,5,5,5); bottom.setBackgroundColor(0xFFF8FAFC);
                  Button play=new Button(this); play.setText("\u25B6"); play.setTextSize(10); Button hlY=new Button(this); hlY.setText("Highlight"); hlY.setTextSize(9); Button copy=new Button(this); copy.setText("Copy"); copy.setTextSize(9); Button share=new Button(this); share.setText("Share"); share.setTextSize(9); Button daily=new Button(this); daily.setText("Daily"); daily.setTextSize(9); Button plan=new Button(this); plan.setText("Plan"); plan.setTextSize(9);
                  bottom.addView(play); bottom.addView(hlY); bottom.addView(copy); bottom.addView(share); bottom.addView(daily); bottom.addView(plan);
                  HorizontalScrollView bScroll=new HorizontalScrollView(this); bScroll.addView(bottom); root.addView(bScroll);

                  setContentView(root);
                  play.setOnClickListener(v->playAudio()); hlY.setOnClickListener(v->doHighlight()); copy.setOnClickListener(v->doCopy()); share.setOnClickListener(v->doShare()); daily.setOnClickListener(v->showDaily()); plan.setOnClickListener(v->showPlan());
                  bookSpin.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){ public void onItemSelected(AdapterView<?> p, View v, int pos, long id){ currentBook=allBooks.get(pos); buildChapters(); show(currentBook,1,1);} public void onNothingSelected(AdapterView<?> p){} });
                  searchBox.setOnEditorActionListener((tv,aid,ev)->{ doSearch(searchBox.getText().toString()); return true; });
                  scopeSpin.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){ public void onItemSelected(AdapterView<?> p, View v, int pos, long id){} public void onNothingSelected(AdapterView<?> p){} });
                  loadDB(); buildChapters(); buildVerses();
                  String lb=prefs.getString("last_book","Genesis"); int lc=prefs.getInt("last_ch",1); int idx=allBooks.indexOf(lb); if(idx>=0) bookSpin.setSelection(idx); show(lb,lc,1);
              }
              public void onInit(int s){ ttsReady=(s==TextToSpeech.SUCCESS); if(ttsReady) tts.setLanguage(Locale.US); }
              void playAudio(){ if(!ttsReady||currentPlain.length()<5) return; tts.stop(); String t=currentPlain.replaceAll("<[^>]+>"," ").replaceAll("\\s+"," ").trim(); if(t.length()>3900) t=t.substring(0,3900); tts.speak(t,TextToSpeech.QUEUE_FLUSH,null,"ew"); }
              void doHighlight(){ webView.evaluateJavascript("javascript:(function(){var sel=window.getSelection(); if(sel.rangeCount>0){ var r=sel.getRangeAt(0); var sp=document.createElement('span'); sp.style.background='yellow'; sp.appendChild(r.extractContents()); r.insertNode(sp);} })()",null); }
              void doCopy(){ webView.evaluateJavascript("(function(){return window.getSelection().toString();})();", val->{ android.content.ClipboardManager cm=(android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE); cm.setPrimaryClip(android.content.ClipData.newPlainText("EW", val)); Toast.makeText(this,"Copied",Toast.LENGTH_SHORT).show(); }); }
              void doShare(){ webView.evaluateJavascript("(function(){return document.body.innerText.substring(0,1000);})();", val->{ android.content.Intent i=new android.content.Intent(android.content.Intent.ACTION_SEND); i.setType("text/plain"); i.putExtra(android.content.Intent.EXTRA_TEXT, val); startActivity(Intent.createChooser(i,"Share")); }); }
              void showDaily(){ webView.loadData(null,"<html><body style='font-family:sans-serif; padding:20px;'><h3>Daily Verse</h3><p>John 3:16 - For God so loved the world...</p><p>Notification daily 8AM</p></body></html>","text/html"); }
              void showPlan(){ webView.loadData(null,"<html><body style='font-family:sans-serif; padding:20px;'><h3>Reading Plan</h3><p>1 Year: 365 days<br>6 Months: 180 days<br>Auto-saved progress</p></body></html>","text/html"); }
              void buildChapters(){ chapterBox.removeAllViews(); int max=getMax(currentBook); for(int i=1;i<=max;i++){ Button b=new Button(this); b.setText(String.valueOf(i)); b.setTextSize(10); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT); lp.setMargins(2,0,2,0); b.setLayoutParams(lp); if(i==currentChapter){ b.setBackgroundColor(0xFF1E3A8A); b.setTextColor(Color.WHITE);} b.setOnClickListener(v->{ int ch=Integer.parseInt(((Button)v).getText().toString()); currentChapter=ch; buildChapters(); buildVerses(); show(currentBook,ch,1);}); chapterBox.addView(b);} }
              void buildVerses(){ verseBox.removeAllViews(); for(int i=1;i<=30;i++){ Button b=new Button(this); b.setText(String.valueOf(i)); b.setTextSize(9); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT); lp.setMargins(2,0,2,0); b.setLayoutParams(lp); if(i==currentVerse){ b.setBackgroundColor(0xFF3B82F6); b.setTextColor(Color.WHITE);} b.setOnClickListener(v->{ int vs=Integer.parseInt(((Button)v).getText().toString()); currentVerse=vs; buildVerses(); show(currentBook,currentChapter,vs);}); verseBox.addView(b);} }
              int getMax(String b){ Map<String,Integer> m=new HashMap<>(); m.put("Genesis",50); m.put("Exodus",40); m.put("Psalm",150); m.put("Matthew",28); m.put("John",21); m.put("Revelation",22); return m.getOrDefault(b,30); }
              void loadDB(){ try{ File out=new File(getFilesDir(),"enduring_word_structured.sqlite3"); if(!out.exists()||out.length()<1000){ String[] nms={"enduring_word_structured.sqlite3","bible.db"}; for(String nm:nms){ try{ InputStream is=getAssets().open(nm); FileOutputStream fos=new FileOutputStream(out); byte[] buf=new byte[8192]; int l; while((l=is.read(buf))>0) fos.write(buf,0,l); fos.close(); is.close(); break; }catch(Exception e){} } } db=SQLiteDatabase.openDatabase(out.getPath(),null,SQLiteDatabase.OPEN_READONLY); }catch(Exception e){} }
              void show(String book,int chapter,int verse){
                  currentChapter=chapter; currentVerse=verse; currentBook=book; prefs.edit().putString("last_book",book).putInt("last_ch",chapter).apply();
                  smallStatus.setText(book+" "+chapter+":"+verse+" - Complete - No cut - Auto saved");
                  try{
                      String content=""; Cursor tbls=db.rawQuery("SELECT name FROM sqlite_master WHERE type='table'",null);
                      while(tbls.moveToNext()){ String t=tbls.getString(0); if(t.contains("android")||t.contains("sqlite")) continue; try{ Cursor data=db.rawQuery("SELECT * FROM "+t+" WHERE book LIKE '%"+book+"%' AND chapter="+chapter+" LIMIT 1",null); if(data.moveToFirst()){ StringBuilder sb=new StringBuilder(); for(int i=0;i<data.getColumnCount();i++){ String val=data.getString(i); if(val!=null && val.length()>100) sb.append(val).append("<br><br>"); } content=sb.toString(); if(content.length()>100){ data.close(); break; } } data.close(); }catch(Exception ex){} } tbls.close();
                      if(content.length()<100){ Cursor v=db.rawQuery("SELECT * FROM commentaries LIMIT 1",null); if(v.moveToFirst()){ StringBuilder sb=new StringBuilder(); for(int i=0;i<v.getColumnCount();i++){ String val=v.getString(i); if(val!=null && val.length()>100) sb.append(val);} String full=sb.toString(); String lower=full.toLowerCase(); int start=lower.indexOf(book.toLowerCase()+" "+chapter+":"); if(start<0) start=lower.indexOf(book.toLowerCase()+" "+chapter); if(start>=0){ int end=full.length(); int nextCh=lower.indexOf(book.toLowerCase()+" "+(chapter+1)+":", start+200); if(nextCh>start) end=nextCh; content=full.substring(start, Math.min(end, start+70000)); int lastP=content.lastIndexOf("</p>"); if(lastP>content.length()-600 && lastP>0) content=content.substring(0,lastP+4); } else content=full.substring(0,50000); } v.close(); }
                      if(content.length()<20) content="<p>"+book+" "+chapter+":"+verse+" commentary</p>";
                      currentPlain=content;
                      String html="<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{font-family:Georgia, serif; font-size:17px; line-height:1.9; padding:16px; color:#1e293b;} h3{color:#1e293b; font-family:sans-serif; font-size:19px; margin-top:24px;} p{margin:14px 0;}</style></head><body>"+content+"</body></html>";
                      webView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                  }catch(Exception e){ webView.loadData(null,"<p>Error: "+e.toString()+"</p>","text/html"); }
              }
              void doSearch(String q){ if(q.length()<2) return; try{ Cursor v=db.rawQuery("SELECT * FROM commentaries LIMIT 1",null); if(v.moveToFirst()){ StringBuilder sb=new StringBuilder(); for(int i=0;i<v.getColumnCount();i++){ String val=v.getString(i); if(val!=null && val.length()>100) sb.append(val);} String full=sb.toString(); int idx=full.toLowerCase().indexOf(q.toLowerCase()); if(idx>=0){ int start=Math.max(0, idx-300); int end=Math.min(full.length(), idx+12000); String snippet=full.substring(start,end); int lastP=snippet.lastIndexOf("</p>"); if(lastP>0) snippet=snippet.substring(0,lastP+4); webView.loadDataWithBaseURL(null, "<html><body style='font-family:sans-serif; padding:15px;'><h3>Search: "+q+"</h3>"+snippet+"</body></html>", "text/html","UTF-8",null);} } v.close(); }catch(Exception e){} }
          }
          '''
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write(code)
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-NO-HEADER-CLEAN
          path: app/build/outputs/apk/debug/*.apk