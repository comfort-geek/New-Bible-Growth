name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip openjdk-17-jdk zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython
      - name: Download DB
        run: curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
      - name: Accept licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea6b3" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | sdkmanager --licenses || true
      - name: Build
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk