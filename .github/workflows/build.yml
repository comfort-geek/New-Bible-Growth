name: Build Enduring Word - ALL 66 BOOKS FULL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build ALL 66 Books Full
        run: |
          mkdir -p /tmp/save
          if [ -f app/src/main/assets/bible.db ]; then cp app/src/main/assets/bible.db /tmp/save/bible.db; fi
          if [ -f app/src/main/assets/bible.sqlite ]; then cp app/src/main/assets/bible.sqlite /tmp/save/bible.db; fi
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradle gradle-wrapper.*.gradle
          python3 << 'PY'
          import pathlib, shutil
          pathlib.Path("app/src/main/java/com/enduringword/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          if pathlib.Path("/tmp/save/bible.db").exists():
              shutil.copy("/tmp/save/bible.db", "app/src/main/assets/bible.db")
          import os
          sdk = os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          open("build.gradle","w").write("// fixed\n")
          open("settings.gradle","w").write("""
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins { id 'com.android.application' version '8.1.4' }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          """)
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enduringword.app'
              compileSdk 33
              defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 104; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Enduring Word" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write('package com.enduringword.app;import android.app.Activity;import android.database.Cursor;import android.database.sqlite.SQLiteDatabase;import android.os.Bundle;import android.text.Editable;import android.text.TextWatcher;import android.view.ViewGroup;import android.webkit.WebView;import android.widget.Button;import android.widget.EditText;import android.widget.HorizontalScrollView;import android.widget.LinearLayout;import android.widget.TextView;import java.io.File;import java.io.FileOutputStream;import java.io.InputStream;import java.util.ArrayList;import java.util.List;public class MainActivity extends Activity{String fullText="";WebView webView;TextView info;String[] allBooks={"Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalm","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"};protected void onCreate(Bundle b){super.onCreate(b);LinearLayout main=new LinearLayout(this);main.setOrientation(LinearLayout.VERTICAL);main.setPadding(5,5,5,5);TextView title=new TextView(this);title.setText("Enduring Word - 66 Books");title.setTextSize(16);main.addView(title);info=new TextView(this);info.setTextSize(12);main.addView(info);EditText search=new EditText(this);search.setHint("Search any verse e.g Genesis 1:1 or Revelation 22");main.addView(search);LinearLayout booksRow1=new LinearLayout(this);booksRow1.setOrientation(LinearLayout.HORIZONTAL);LinearLayout booksRow2=new LinearLayout(this);booksRow2.setOrientation(LinearLayout.HORIZONTAL);for(int i=0;i<allBooks.length;i++){Button btn=new Button(this);btn.setText(allBooks[i]);btn.setTextSize(10);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);lp.setMargins(2,2,2,2);btn.setLayoutParams(lp);final String book=allBooks[i];final int idx=i;btn.setOnClickListener(v->{showBook(book, idx);});if(i<33) booksRow1.addView(btn); else booksRow2.addView(btn);}HorizontalScrollView hsv1=new HorizontalScrollView(this);hsv1.addView(booksRow1);HorizontalScrollView hsv2=new HorizontalScrollView(this);hsv2.addView(booksRow2);main.addView(hsv1);main.addView(hsv2);webView=new WebView(this);webView.getSettings().setJavaScriptEnabled(false);LinearLayout.LayoutParams wlp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f);main.addView(webView,wlp);setContentView(main);try{File outFile=new File(getFilesDir(),"bible.db");if(!outFile.exists()){InputStream is=getAssets().open("bible.db");FileOutputStream fos=new FileOutputStream(outFile);byte[] buf=new byte[8192];int len;while((len=is.read(buf))>0)fos.write(buf,0,len);fos.close();is.close();}SQLiteDatabase db=SQLiteDatabase.openDatabase(outFile.getPath(),null,SQLiteDatabase.OPEN_READONLY);Cursor v=db.rawQuery("SELECT * FROM commentaries LIMIT 1",null);if(v.moveToFirst()){StringBuilder sb=new StringBuilder();for(int i=0;i<v.getColumnCount();i++){String val=v.getString(i);if(val!=null && val.length()>50) sb.append(val).append("\\n");}fullText=sb.toString();if(fullText.length()<100){for(int i=0;i<v.getColumnCount();i++){String val=v.getString(i);if(val!=null) fullText+=val+" ";}}info.setText("Loaded: "+(fullText.length()/1024)+" KB - Contains Genesis to Revelation");showBook("Genesis",0);}v.close();db.close();}catch(Exception e){info.setText("Error: "+e.toString());}search.addTextChangedListener(new TextWatcher(){public void beforeTextChanged(CharSequence s,int a,int b,int c){}public void onTextChanged(CharSequence s,int a,int b,int c){}public void afterTextChanged(Editable s){String q=s.toString();if(q.length()<3) return;int idx=fullText.toLowerCase().indexOf(q.toLowerCase());if(idx>=0){int start=Math.max(0, idx-200);int end=Math.min(fullText.length(), idx+20000);String snippet=fullText.substring(start,end);info.setText("Found: "+q+" at "+idx);showHtml(snippet, "Search: "+q);}}});}void showBook(String book, int bookIndex){if(fullText.length()==0) return;String lowerFull=fullText.toLowerCase();String lowerBook=book.toLowerCase();int start=lowerFull.indexOf(lowerBook);if(start<0){info.setText(book+" not found, trying...");showHtml("<h2>"+book+"</h2><p>Searching...</p>",book);return;}int end=fullText.length();for(int i=bookIndex+1;i<allBooks.length;i++){String nextBook=allBooks[i].toLowerCase();int nextIdx=lowerFull.indexOf(nextBook, start+book.length()+100);if(nextIdx>start+1000 && nextIdx-start<500000){end=nextIdx;break;}}if(end-start>300000) end=start+300000;String bookContent=fullText.substring(start,end);info.setText(book+" - "+(bookContent.length()/1024)+" KB - Genesis 1:1 to last chapter of "+book);showHtml(bookContent, book);}void showHtml(String htmlContent, String title){String html="<!DOCTYPE html><html><head><meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1\\"><style>body{font-family: sans-serif; font-size:16px; line-height:1.7; padding:12px; color:#222;} h1,h2,h3,h4{color:#1a5276; margin-top:25px; margin-bottom:10px;} h3{border-bottom:2px solid #1a5276; padding-bottom:5px;} p{margin:12px 0;}.book-title{background:#1a5276; color:white; padding:10px; font-size:20px;}</style></head><body><div class=\\"book-title\\">"+title+"</div>"+htmlContent+"<br><br><br></body></html>";webView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);webView.scrollTo(0,0);}void showHtml(String htmlContent){showHtml(htmlContent, "Enduring Word");}}')
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-ALL-66-BOOKS-FULL
          path: app/build/outputs/apk/debug/*.apk