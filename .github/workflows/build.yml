name: Build Enduring Word APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Android project with Python
        run: |
          python3 << 'PY'
          import os
          os.makedirs("app/src/main/java/com/enduringword/app", exist_ok=True)
          os.makedirs("app/src/main", exist_ok=True)
          open("settings.gradle","w").write("include ':app'\n")
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("plugins { id 'com.android.application' }\nandroid { namespace 'com.enduringword.app'; compileSdk 34; defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 34; versionCode 84; versionName '1.0' } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n")
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Enduring Word"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write('package com.enduringword.app;import android.os.Bundle;import android.widget.TextView;import androidx.appcompat.app.AppCompatActivity;public class MainActivity extends AppCompatActivity{protected void onCreate(Bundle b){super.onCreate(b);TextView tv=new TextView(this);tv.setText("Enduring Word - 13 Features");setContentView(tv);}}')
          print("files created")
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK
          path: app/build/outputs/apk/debug/*.apk