name: Build Enduring Word APK - Deep Rebuild
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Deep Clean and Rebuild ALL Files
        run: |
          python3 << 'PY'
          import os, shutil, pathlib
          # DELETE old broken files
          for p in ["app", "src", "build.gradle", "settings.gradle", "gradle.properties", "gradlew", "gradlew.bat", "gradle"]:
              if os.path.exists(p):
                  if os.path.isdir(p): shutil.rmtree(p)
                  else: os.remove(p)
                  print(f"deleted {p}")

          # CREATE fresh structure
          pathlib.Path("app/src/main/java/com/enduringword/app").mkdir(parents=True, exist_ok=True)

          open("settings.gradle","w").write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\ninclude ':app'\n")
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
           namespace 'com.enduringword.app'
           compileSdk 34
           defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 34; versionCode 86; versionName '1.0' }
           compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Enduring Word" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/enduringword/app/MainActivity.java","w").write("""
          package com.enduringword.app;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.setWebViewClient(new WebViewClient());
              w.getSettings().setJavaScriptEnabled(true);
              w.loadUrl("https://enduringword.com");
              setContentView(w);
            }
          }
          """)
          print("REBUILD DONE - all old errors removed")
          PY
          ls -R
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK-DEEP-REBUILD-86
          path: app/build/outputs/apk/debug/*.apk