name: Build New Bible Growth APK - V94
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Name
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradle
          python3 << 'PY'
          import pathlib, os
          pathlib.Path("app/src/main/java/com/newbiblegrowth/app").mkdir(parents=True, exist_ok=True)
          sdk = os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')
          open("local.properties","w").write(f"sdk.dir={sdk}\n")
          open("settings.gradle","w").write("""
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins { id 'com.android.application' version '8.1.4' }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          """)
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.newbiblegrowth.app'
              compileSdk 33
              defaultConfig { applicationId 'com.newbiblegrowth.app'; minSdk 21; targetSdk 33; versionCode 94; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="New Bible Growth" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/newbiblegrowth/app/MainActivity.java","w").write('package com.newbiblegrowth.app;import android.app.Activity;import android.os.Bundle;import android.widget.TextView;public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);TextView tv=new TextView(this);tv.setTextSize(24);tv.setPadding(50,250,50,50);tv.setText("New Bible Growth");setContentView(tv);}}')
          print("Renamed to New Bible Growth")
          PY
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Bible-Growth-APK
          path: app/build/outputs/apk/debug/*.apk