name: Build APK 50MB ZERO DOWNLOAD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 + Python 3.10
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check pre-installed SDK - NO DOWNLOAD NEEDED
        run: |
          ls /usr/local/lib/android/sdk/build-tools/ | head -20
          ls /usr/local/lib/android/sdk/ndk/ | head -10
          echo "Using system SDK - 0 MB download"
          du -sh /usr/local/lib/android/sdk/build-tools/33.0.2 || true

      - name: Install only buildozer + aidl (50MB)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl ant
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Download DB
        run: |
          wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Clean
        run: rm -rf .buildozer bin

      - name: Build APK - Uses System SDK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-50MB
          path: bin/*.apk