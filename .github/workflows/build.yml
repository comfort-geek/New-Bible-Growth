name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls $ANDROID_SDK_ROOT/platforms || true

      - name: Download index.html from Release
        run: |
          mkdir -p app/src/main/java/com/bible/commentary
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/index.html https://github.com/comfort-geek/New-Bible-Growth/releases/download/V1.1.0/index.html
          ls -lh app/src/main/assets/
          head -c 200 app/src/main/assets/index.html

      - name: Create Project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'New-Bible-Growth'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bible.commentary'
            compileSdk 34
            defaultConfig { applicationId 'com.bible.commentary' minSdk 24 targetSdk 34 versionCode 1 versionName '1.0' }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Bible Commentary" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
          EOF
          cat > app/src/main/java/com/bible/commentary/MainActivity.java <<'EOF'
          package com.bible.commentary;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            protected void onCreate(Bundle s) {
              super.onCreate(s); setContentView(R.layout.activity_main);
              webView = findViewById(R.id.webview);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setAllowFileAccess(true);
              webView.loadUrl("file:///android_asset/index.html");
            }
            public void onBackPressed() { if (webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          EOF

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bible-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
