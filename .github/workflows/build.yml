name: Build APK 50MB WORKING NOW

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 + Python 3.10
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install buildozer + aidl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl ant
          pip install buildozer==1.5.0 cython==0.29.33

      - name: SYMLINK SYSTEM SDK - NO DOWNLOAD
        run: |
          echo "Runner has:"
          ls /usr/local/lib/android/sdk/build-tools/
          ls /usr/local/lib/android/sdk/ndk/
          
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          
          # Link NDK 28c to system NDK 30 so it doesn't download 600MB
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c
          ln -s /usr/local/lib/android/sdk/ndk/30.0.16248370 ~/.buildozer/android/platform/android-ndk-r28c
          
          # Accept ALL licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          ls ~/.buildozer/android/platform/android-sdk/build-tools/
          ls -l ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager

      - name: Download DB
        run: wget -O enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-FIXED
          path: bin/*.apk