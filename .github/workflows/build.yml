name: Build APK Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Gradle
        run: rm -f settings.gradle build.gradle && echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle && echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle && echo "include ':app'" >> settings.gradle && echo "// empty" > build.gradle && echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties && echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties && echo "plugins { id 'com.android.application' version '8.1.4' }" > app/build.gradle && echo "android { namespace 'com.enduringword.app'; compileSdk 33; defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 316; versionName 'Minimal' } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }" >> app/build.gradle && mkdir -p gradle/wrapper && echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties && echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties && echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties && echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties && echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties && curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar && curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew && chmod +x gradlew
      - name: Build APK
        run: chmod +x gradlew &&./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduringWord-APK
          path: app/build/outputs/apk/debug/app-debug.apk
