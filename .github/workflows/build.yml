name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4
      
      - name: Download 70MB DB
        run: |
          wget -O enduring_word_full.db "https://github.com/comfort-geek/New-Bible-Growth/releases/download/V1.2/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake

      - name: Patch Buildozer SDK path bug
        run: |
          pip install cython==0.29.33
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          PYFILE=$(python -c "import buildozer.targets.android; print(buildozer.targets.android.__file__)")
          echo "Patching $PYFILE"
          sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' "$PYFILE"
          sed -i 's|tools/bin/avdmanager|cmdline-tools/latest/bin/avdmanager|g' "$PYFILE"
          echo "Patched OK"

      - name: Build APK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk