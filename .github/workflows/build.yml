name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix All Files
        run: |
          rm -rf build.gradle app/build.gradle settings.gradle gradle.properties app/src/main/java
          cat > settings.gradle <<'END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          END
          cat > gradle.properties <<'END'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          END
          mkdir -p app/src/main/java/com/enduringword/app app/src/main/assets
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' version '8.1.2' apply true }
          android { namespace 'com.enduringword.app'; compileSdk 33; defaultConfig { applicationId 'com.enduringword.app'; minSdk 21; targetSdk 33; versionCode 308; versionName 'DB-Inspector' } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          END
          cat > app/src/main/AndroidManifest.xml <<'END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Enduring Word" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".MainActivity" android:exported="true" android:icon="@mipmap/ic_launcher">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          END
          cat > app/src/main/java/com/enduringword/app/MainActivity.java <<'END'
          package com.enduringword.app;
          import android.app.Activity; import android.database.Cursor; import android.database.sqlite.SQLiteDatabase; import android.os.Bundle; import android.widget.*; import java.io.*;
          public class MainActivity extends Activity{
            protected void onCreate(Bundle b){ super.onCreate(b); ScrollView sv=new ScrollView(this); TextView tv=new TextView(this); tv.setTextSize(13); tv.setPadding(20,20,20,20); sv.addView(tv); setContentView(sv);
              StringBuilder out=new StringBuilder();
              try{
                File f=new File(getFilesDir(),"bible.db");
                if(!f.exists()){ InputStream is=getAssets().open("bible.db"); FileOutputStream fos=new FileOutputStream(f); byte[] buf=new byte[8192]; int l; while((l=is.read(buf))>0) fos.write(buf,0,l); fos.close(); is.close(); }
                SQLiteDatabase db=SQLiteDatabase.openDatabase(f.getPath(),null,SQLiteDatabase.OPEN_READONLY);
                out.append("DB SIZE: "+f.length()/1024+" KB\n\n");
                Cursor tbls=db.rawQuery("SELECT name FROM sqlite_master WHERE type='table'",null);
                while(tbls.moveToNext()){
                  String t=tbls.getString(0);
                  out.append("TABLE: "+t+"\n");
                  try{
                    Cursor cols=db.rawQuery("SELECT * FROM "+t+" LIMIT 1",null);
                    out.append(" Columns ("+cols.getColumnCount()+"): ");
                    for(int i=0;i<cols.getColumnCount();i++) out.append(cols.getColumnName(i)+", ");
                    out.append("\n");
                    if(cols.moveToFirst()){
                      for(int i=0;i<cols.getColumnCount();i++){
                        String v=cols.getString(i);
                        if(v!=null) out.append(" ["+cols.getColumnName(i)+"] = "+v.substring(0,Math.min(200,v.length()))+"\n");
                      }
                    }
                    cols.close();
                  }catch(Exception e){ out.append(" ERROR: "+e+"\n"); }
                  out.append("\n---\n\n");
                }
                tbls.close();
                db.close();
              }catch(Exception e){ out.append("FATAL: "+e.toString()+"\n"); for(StackTraceElement s:e.getStackTrace()) out.append(s.toString()+"\n"); }
              tv.setText(out.toString());
            }
          }
          END
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DB-Inspector
          path: app/build/outputs/apk/debug/*.apk