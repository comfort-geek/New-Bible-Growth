name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: gradle/gradle-build-action@v3
        with: {gradle-version: 8.7}
      - name: Convert JPG icons to real PNG
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -rf app/src/main/res/mipmap-*
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi
          # If you have your jpg somewhere, convert it - for now use default valid pngs
          # Create valid empty launcher from system
          cp /usr/share/icons/hicolor/48x48/apps/*.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || echo "using default"
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          # also need round
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: Bible-Commentary-APK, path: app/build/outputs/apk/release/*.apk}