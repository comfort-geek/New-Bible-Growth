name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DB from Archive
        run: |
          apt-get update -y
          apt-get install -y wget curl
          curl -L -o enduring_word_full.db "https://archive.org/download/enduring_word_full/enduring_word_full.db"
          ls -lh enduring_word_full.db

      - name: Patch buildozer binary directly
        run: |
          cat /home/user/.venv/bin/buildozer
          echo "--- PATCHING ---"
          # Insert bypass before import
          sed -i "1a import buildozer; buildozer.Buildozer.check_root = lambda self: print('ROOT CHECK BYPASSED')" /home/user/.venv/bin/buildozer
          cat /home/user/.venv/bin/buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: enduring-word-apk
          path: bin/*.apk