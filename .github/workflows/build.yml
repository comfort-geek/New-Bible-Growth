name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: gradle/gradle-build-action@v3
        with: {gradle-version: 8.7}

      - name: Fix icons and manifest
        run: |
          rm -rf app/src/main/res/mipmap-* || true
          sed -i 's/@mipmap\/ic_launcher/@android:mipmap\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher_round/@android:mipmap\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher/@android:mipmap\/sym_def_app_icon/g' app/src/main/res/values/*.xml || true
          echo "Fixed"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with: {name: Bible-Commentary-APK, path: app/build/outputs/apk/release/*.apk}